version: 2

models:
  # ---- Staging ----
  - name: stg_races
    description: "One row per race, de-duplicated from the raw runner-level seed."
    columns:
      - name: race_id
        description: "Primary key for a race."
        tests:
          - unique
          - not_null
      - name: course_id
        description: "FK to stg_courses.course_id."
      - name: race_date
        description: "Date of the race (YYYY-MM-DD)."

  - name: stg_results
    columns:
      - name: race_id
        tests: [not_null]
      - name: horse_id
        tests: [not_null]


  - name: stg_courses
    columns:
      - name: course_id
        tests:
          - unique
          - not_null

  # ---- Marts ----
  - name: race_counts_by_course
    description: "Aggregate race counts and field stats per course route."
    columns:
      - name: course_id
        tests:
          - unique
          - not_null
      - name: n_races
        tests:
          - not_null


  - name: fct_race_results
    columns:
      - name: race_id
        tests:
          - relationships:
              to: ref('stg_races')
              field: race_id
      - name: course_id
        tests:
          - relationships:
              to: ref('stg_courses')
              field: course_id


  - name: course_performance
    columns:
      - name: course_id
        tests: 
          - unique
          - not_null
  
  - name: jockey_performance
    columns:
      - name: jockey_id
        tests: [not_null]
  
  - name: market_calibration
    columns:
      - name: bucket_low
        tests: [not_null]
      - name: n_runs
        tests: [not_null]
  
  # NOTE: the `accepted_range` test (to assert probabilities are in [0,1]) comes
  # from the dbt_utils package. It's a nice extension later; the built-in tests
  # above keep `dbt test` working with no extra dependency.
